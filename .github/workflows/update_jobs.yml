name: Update internship jobs

on:
  schedule:
    # Twice daily in UTC: about 08:23/20:23 CDT or 07:23/19:23 CST.
    - cron: '23 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository and previous snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect jobs and notify new target matches
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit changed data and snapshot
        env:
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "jzikim"
          git config user.email "264001939+jzikim@users.noreply.github.com"
          git add -- data/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git commit -m "chore: automated internship update"
          git push origin "HEAD:${UPDATE_BRANCH}"
